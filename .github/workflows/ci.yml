name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartroute
          POSTGRES_PASSWORD: smartroute_dev
          POSTGRES_DB: smartroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartroute -d smartroute"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://smartroute:smartroute_dev@localhost:5432/smartroute?schema=public
      # CI deliberately omits FLIGHT_PROVIDER and DUFFEL_API_KEY so the backend
      # boots with the mock provider (zod default). Tests must stay deterministic
      # and offline — never set Duffel credentials here.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @smartroute/backend db:generate

      - name: Apply migrations
        run: pnpm --filter @smartroute/backend exec prisma migrate deploy

      - name: Build shared package
        run: pnpm --filter @smartroute/shared build

      - name: Seed attractions (validates dataset against real schema)
        run: pnpm --filter @smartroute/backend db:seed

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
